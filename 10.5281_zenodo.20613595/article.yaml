# Don't forget to surround abstract with double quotes
abstract: "This article is the reproduction of the computational model of glucose absorption by
the enterocyte by Afshar et al. in 2021 and more precisely, the reproduction made
by the authors themselves in 2023. The enterocyte is the main component of the
intestinal barrier, that is the cell type transporting glucose from digested food in the
intestine to the blood. To this day, the model from Afshar et al. is the most complete
description of enterocyte absorption, defined in terms of ordinary differential equations
for the glucose, the ionic species and other physical properties of the cell.
This paper presents a complete reengineering and rewriting of this model in a differ‐
ent language, from CellML to Julia, with added comments and bibliography. We re‐
produce each figure of the original paper and comment on their meaning. Our repro‐
duction is freely available with the following link (https://gitlab.univ-lille.fr/cedric.lhoussaine/
glucoseuptake_sglt1_glut2) and can be easily modified for reuse and modification of the
model and its parameters."

